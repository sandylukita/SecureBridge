# SecureBridge — Lab / Demo Configuration
# Use this for showcase and development

mode: lab

capture:
  interface: "127.0.0.1"        # Loopback for lab
  target_network: "127.0.0.0/8"
  buffer_size: 65536

simulator:
  enabled: true
  plc_count: 3
  polling_interval: 5            # seconds
  inject_anomalies: true         # Auto-inject OT incident scenarios for demo

detection:
  anomaly_threshold: 60.0        # 0-100 score
  baseline_hours: 1              # Short for lab
  retrain_interval_hours: 24

alerts:
  email_enabled: false
  telegram_enabled: false
  min_severity: "MEDIUM"

dashboard:
  host: "localhost"
  port: 8501
  refresh_seconds: 5

compliance:
  client_name: "PT Nusantara Instrumen (Demo)"
  consultant_name: "Sandy Lukita"
  consulting_firm: "PT Optima Sarana Instrument"
  report_output_dir: "data/reports"

llm:
  provider: auto                   # groq | auto | gemini | claude | ollama | air-gapped
  groq_model: llama-3.3-70b-versatile
  gemini_model: gemini-flash-latest # Free tier & ultra-fast for showcase (needs GEMINI_API_KEY)
  ollama_model: qwen2.5:3b       # Local model (run: ollama pull qwen2.5:3b)
  ollama_host: http://localhost:11434
  claude_model: claude-sonnet-4-6

log_dir: "data/logs"
data_dir: "data"
